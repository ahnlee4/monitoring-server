events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

  upstream portal_upstream {
    server portal:8000;
  }

  server {
    listen 80 default_server;
    server_name tms.theintech.co.kr *.tms.theintech.co.kr;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name tms.theintech.co.kr;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/tms.theintech.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.theintech.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://portal_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /internal/ {
      return 404;
    }

    location / {
      proxy_pass http://portal_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 443 ssl;
    server_name "~^(?<monitoring_slug>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.tms\.theintech\.co\.kr$";
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/tms.theintech.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.theintech.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 401 = @login_redirect;
    error_page 403 = @forbidden_redirect;

    location = /_gateway_auth {
      internal;
      proxy_pass http://portal_upstream/internal/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @login_redirect {
      return 302 https://tms.theintech.co.kr/login?next=https://$host;
    }

    location @forbidden_redirect {
      return 302 https://tms.theintech.co.kr/?error=forbidden;
    }

    location / {
      auth_request /_gateway_auth;
      auth_request_set $target_upstream $upstream_http_x_target_upstream;
      auth_request_set $authenticated_user $upstream_http_x_authenticated_user;
      auth_request_set $monitoring_server $upstream_http_x_monitoring_server;
      proxy_pass http://$target_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Authenticated-User $authenticated_user;
      proxy_set_header X-Monitoring-Server $monitoring_server;
      proxy_set_header Cookie "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 30s;
    }
  }
}
