services:
  edge-agent:
    image: ghcr.io/ahnlee4/monitoring-collector:latest
    container_name: monitoring-edge-agent
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      EDGE_NODE_ID: ${EDGE_NODE_ID}
      EDGE_NODE_TOKEN: ${EDGE_NODE_TOKEN}
      EDGE_SERVER_URL: ${EDGE_SERVER_URL}
      EDGE_SOFTWARE_VERSION: ${EDGE_SOFTWARE_VERSION:-0.1.143}
      EDGE_OUTBOX_PATH: /var/lib/monitoring-edge/outbox.db
      EDGE_OUTBOX_MAX_ROWS: ${EDGE_OUTBOX_MAX_ROWS:-10000}
      COLLECTOR_DRIVER: rs485
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-0}
      COLLECTOR_PUBLISH_TELEMETRY: "false"
      COLLECTOR_REQUEST_TIMEOUT_SECONDS: ${COLLECTOR_REQUEST_TIMEOUT_SECONDS:-5}
      COLLECTOR_CONTROL_REQUEST_TIMEOUT_SECONDS: ${COLLECTOR_CONTROL_REQUEST_TIMEOUT_SECONDS:-5}
      COLLECTOR_CONTROL_COMMAND_LIMIT: ${COLLECTOR_CONTROL_COMMAND_LIMIT:-1}
      COLLECTOR_CONTROL_COMMAND_DELAY_SECONDS: ${COLLECTOR_CONTROL_COMMAND_DELAY_SECONDS:-0.05}
      COLLECTOR_CONTROL_POLL_SECONDS: ${COLLECTOR_CONTROL_POLL_SECONDS:-0.2}
      COLLECTOR_SETTINGS_POLL_SECONDS: ${COLLECTOR_SETTINGS_POLL_SECONDS:-2}
      COLLECTOR_SLOW_POLL_LOG_MS: ${COLLECTOR_SLOW_POLL_LOG_MS:-0}
      COLLECTOR_STATUS_LOG_INTERVAL_SECONDS: ${COLLECTOR_STATUS_LOG_INTERVAL_SECONDS:-10}
      COLLECTOR_IDLE_LOOP_DELAY_SECONDS: ${COLLECTOR_IDLE_LOOP_DELAY_SECONDS:-0.01}
      RS485_SERIAL_PORT: ${RS485_SERIAL_PORT:-/dev/ttyUSB0}
      RS485_BAUDRATE: ${RS485_BAUDRATE:-38400}
      RS485_COMP_QTY: ${RS485_COMP_QTY:-8}
      RS485_POWER_POLL_INTERVAL_CYCLES: ${RS485_POWER_POLL_INTERVAL_CYCLES:-1}
      RS485_DIO_POLL_INTERVAL_CYCLES: ${RS485_DIO_POLL_INTERVAL_CYCLES:-1}
      RS485_MODULE_POLL_INTERVAL_CYCLES: ${RS485_MODULE_POLL_INTERVAL_CYCLES:-1}
      RS485_RESPONSE_TIMEOUT_SECONDS: ${RS485_RESPONSE_TIMEOUT_SECONDS:-0.35}
      RS485_INTER_REQUEST_DELAY_SECONDS: ${RS485_INTER_REQUEST_DELAY_SECONDS:-0.005}
      RS485_WRITE_REQUEST_DELAY_SECONDS: ${RS485_WRITE_REQUEST_DELAY_SECONDS:-0.005}
      RS485_WRITE_RESPONSE_TIMEOUT_SECONDS: ${RS485_WRITE_RESPONSE_TIMEOUT_SECONDS:-0.35}
      RS485_WRITE_VERIFY_ATTEMPTS: ${RS485_WRITE_VERIFY_ATTEMPTS:-3}
      RS485_DEBUG_HEX: ${RS485_DEBUG_HEX:-false}
      RS485_SETTINGS_POLL_INTERVAL_CYCLES: ${RS485_SETTINGS_POLL_INTERVAL_CYCLES:-5}
      RS485_FULL_SNAPSHOT_INTERVAL_CYCLES: ${RS485_FULL_SNAPSHOT_INTERVAL_CYCLES:-5}
    volumes:
      - /dev:/dev
      - edge_outbox:/var/lib/monitoring-edge

volumes:
  edge_outbox:
