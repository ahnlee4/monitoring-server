name: ${GATEWAY_COMPOSE_PROJECT_NAME:-monitoring-gateway}

services:
  gateway-db:
    image: postgres:16-alpine
    container_name: monitoring-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GATEWAY_POSTGRES_DB:-monitoring_gateway}
      POSTGRES_USER: ${GATEWAY_POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?GATEWAY_POSTGRES_PASSWORD must be set}
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GATEWAY_POSTGRES_USER:-gateway} -d ${GATEWAY_POSTGRES_DB:-monitoring_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: ./gateway/portal
    container_name: monitoring-gateway-portal
    restart: unless-stopped
    environment:
      PORTAL_DATABASE_URL: ${GATEWAY_DATABASE_URL:?GATEWAY_DATABASE_URL must be set}
      BASE_DOMAIN: ${GATEWAY_BASE_DOMAIN:-tms.theintech.co.kr}
      SESSION_COOKIE_NAME: monitor_session
      SESSION_COOKIE_DOMAIN: .${GATEWAY_BASE_DOMAIN:-tms.theintech.co.kr}
      SESSION_SECURE: "true"
      SESSION_TTL_HOURS: ${GATEWAY_SESSION_TTL_HOURS:-12}
      BOOTSTRAP_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD must be set}
      TRUSTED_ORIGINS: https://${GATEWAY_BASE_DOMAIN:-tms.theintech.co.kr}
      ALLOWED_TARGET_PORTS: ${GATEWAY_ALLOWED_TARGET_PORTS:-80,8080,18080}
      REGISTRATION_ENABLED: ${GATEWAY_REGISTRATION_ENABLED:-true}
      SMTP_HOST: ${GATEWAY_SMTP_HOST:-smtp.naver.com}
      SMTP_PORT: ${GATEWAY_SMTP_PORT:-465}
      SMTP_USERNAME: ${GATEWAY_SMTP_USERNAME:-ahnlee4@naver.com}
      SMTP_PASSWORD: ${GATEWAY_SMTP_PASSWORD:-}
      SMTP_FROM: ${GATEWAY_SMTP_FROM:-ahnlee4@naver.com}
      EMAIL_VERIFICATION_TTL_MINUTES: ${GATEWAY_EMAIL_VERIFICATION_TTL_MINUTES:-10}
      EMAIL_VERIFICATION_COOLDOWN_SECONDS: ${GATEWAY_EMAIL_VERIFICATION_COOLDOWN_SECONDS:-60}
      EMAIL_VERIFICATION_HOURLY_LIMIT: ${GATEWAY_EMAIL_VERIFICATION_HOURLY_LIMIT:-5}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${GATEWAY_EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
    depends_on:
      gateway-db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway-nginx:
    image: nginx:1.27-alpine
    container_name: monitoring-gateway-nginx
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  gateway_postgres_data:
